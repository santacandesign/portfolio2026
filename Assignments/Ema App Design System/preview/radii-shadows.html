<!doctype html>
<!-- @dsCard group="Spacing" name="Radii & shadows" subtitle="Corner radii and elevation scale" viewport="700x200" --><html><head><meta charset="utf-8">
<link rel="stylesheet" href="_base.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"/>
</head><body><style></style>
<div class="label-tiny">Radii & shadow</div>
<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
  
    <div style="text-align:center">
      <div style="width:60px;height:48px;background:var(--white);border:1px solid var(--beige-400);border-radius:4px"></div>
      <div style="font-size:10px;font-weight:700;margin-top:4px;color:var(--fg2)">radius-xs</div>
      <div style="font-size:10px;color:var(--fg3)">4px</div>
    </div>
    <div style="text-align:center">
      <div style="width:60px;height:48px;background:var(--white);border:1px solid var(--beige-400);border-radius:6px"></div>
      <div style="font-size:10px;font-weight:700;margin-top:4px;color:var(--fg2)">radius-sm</div>
      <div style="font-size:10px;color:var(--fg3)">6px</div>
    </div>
    <div style="text-align:center">
      <div style="width:60px;height:48px;background:var(--white);border:1px solid var(--beige-400);border-radius:8px"></div>
      <div style="font-size:10px;font-weight:700;margin-top:4px;color:var(--fg2)">radius-md</div>
      <div style="font-size:10px;color:var(--fg3)">8px</div>
    </div>
    <div style="text-align:center">
      <div style="width:60px;height:48px;background:var(--white);border:1px solid var(--beige-400);border-radius:12px"></div>
      <div style="font-size:10px;font-weight:700;margin-top:4px;color:var(--fg2)">radius-lg</div>
      <div style="font-size:10px;color:var(--fg3)">12px</div>
    </div>
    <div style="text-align:center">
      <div style="width:60px;height:48px;background:var(--white);border:1px solid var(--beige-400);border-radius:16px"></div>
      <div style="font-size:10px;font-weight:700;margin-top:4px;color:var(--fg2)">radius-xl</div>
      <div style="font-size:10px;color:var(--fg3)">16px</div>
    </div>
    <div style="text-align:center">
      <div style="width:60px;height:48px;background:var(--white);border:1px solid var(--beige-400);border-radius:9999px"></div>
      <div style="font-size:10px;font-weight:700;margin-top:4px;color:var(--fg2)">radius-pill</div>
      <div style="font-size:10px;color:var(--fg3)">9999px</div>
    </div>
</div>
<div style="display:flex;gap:16px;margin-top:14px;align-items:center;flex-wrap:wrap">
  
    <div style="text-align:center">
      <div style="width:64px;height:40px;background:var(--white);border:1px solid var(--beige-300);border-radius:8px;box-shadow:0 1px 2px rgba(35,33,25,.04)"></div>
      <div style="font-size:10px;font-weight:700;margin-top:6px;color:var(--fg2)">shadow-xs</div>
    </div>
    <div style="text-align:center">
      <div style="width:64px;height:40px;background:var(--white);border:1px solid var(--beige-300);border-radius:8px;box-shadow:0 1px 2px rgba(35,33,25,.06),0 1px 3px rgba(35,33,25,.06)"></div>
      <div style="font-size:10px;font-weight:700;margin-top:6px;color:var(--fg2)">shadow-sm</div>
    </div>
    <div style="text-align:center">
      <div style="width:64px;height:40px;background:var(--white);border:1px solid var(--beige-300);border-radius:8px;box-shadow:0 4px 6px -1px rgba(35,33,25,.08),0 2px 4px -2px rgba(35,33,25,.06)"></div>
      <div style="font-size:10px;font-weight:700;margin-top:6px;color:var(--fg2)">shadow-md</div>
    </div>
    <div style="text-align:center">
      <div style="width:64px;height:40px;background:var(--white);border:1px solid var(--beige-300);border-radius:8px;box-shadow:0 10px 15px -3px rgba(35,33,25,.10),0 4px 6px -4px rgba(35,33,25,.06)"></div>
      <div style="font-size:10px;font-weight:700;margin-top:6px;color:var(--fg2)">shadow-lg</div>
    </div>
    <div style="text-align:center">
      <div style="width:64px;height:40px;background:var(--white);border:1px solid var(--beige-300);border-radius:8px;box-shadow:0 0 0 3px rgba(31,136,68,.25)"></div>
      <div style="font-size:10px;font-weight:700;margin-top:6px;color:var(--fg2)">shadow-focus</div>
    </div>
</div></body></html>
