<!doctype html>
<!-- @dsCard group="Components" name="Components · Separator" subtitle="horizontal/vertical · default/dashed/dotted" viewport="700x280" --><html><head><meta charset="utf-8">
<link rel="stylesheet" href="_base.css">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"/>
<style>
.section{font-size:12px;line-height:16px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--fg3);margin:10px 0 6px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.col{display:flex;flex-direction:column;gap:8px}

</style></head><body style="padding:14px 16px">
<div class="section">Horizontal · default / dashed / dotted</div>
<div class="col" style="max-width:400px;gap:16px">
  <div>
    <div style="font-size:12px;color:var(--fg3);margin-bottom:6px">default · bg-beige-500</div>
    <div style="height:1px;background:var(--beige-500);width:100%"></div>
  </div>
  <div>
    <div style="font-size:12px;color:var(--fg3);margin-bottom:6px">dashed</div>
    <div style="height:1px;border-top:1px dashed var(--beige-500);width:100%"></div>
  </div>
  <div>
    <div style="font-size:12px;color:var(--fg3);margin-bottom:6px">dotted</div>
    <div style="height:1px;border-top:1px dotted var(--beige-500);width:100%"></div>
  </div>
</div>
<div class="section">Vertical · in a toolbar</div>
<div class="row" style="height:32px;align-items:center;background:#fff;border:1px solid var(--beige-300);border-radius:8px;padding:0 8px;width:fit-content">
  <i class="ph ph-text-bold" style="font-size:16px;color:var(--fg1)"></i>
  <i class="ph ph-text-italic" style="font-size:16px;color:var(--fg1)"></i>
  <div style="width:1px;height:16px;background:var(--beige-500);margin:0 4px"></div>
  <i class="ph ph-text-align-left" style="font-size:16px;color:var(--fg1)"></i>
  <i class="ph ph-text-align-center" style="font-size:16px;color:var(--fg1)"></i>
  <i class="ph ph-text-align-right" style="font-size:16px;color:var(--fg1)"></i>
  <div style="width:1px;height:16px;background:var(--beige-500);margin:0 4px"></div>
  <i class="ph ph-link" style="font-size:16px;color:var(--fg1)"></i>
</div>
<div class="section">With label</div>
<div style="display:flex;align-items:center;gap:10px;max-width:360px">
  <div style="flex:1;height:1px;background:var(--beige-400)"></div>
  <span style="font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--fg3)">Or continue with</span>
  <div style="flex:1;height:1px;background:var(--beige-400)"></div>
</div></body></html>
