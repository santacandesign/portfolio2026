<!doctype html>
<!-- @dsCard group="Components" name="Components · PopConfirm" subtitle="dark bubble · cancel+confirm · top/bottom sides · non-destructive" viewport="700x360" --><html><head><meta charset="utf-8">
<link rel="stylesheet" href="_base.css">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"/>
<style>
.section{font-size:12px;line-height:16px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--fg3);margin:10px 0 6px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
/* shared btn */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 16px;border-radius:6px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;border:0;transition:background .15s}
.btn-primary{background:var(--green-800);color:#fff}.btn-primary:hover{background:var(--green-900)}
.btn-secondary{background:#fff;color:var(--fg1);border:1px solid var(--beige-500)}.btn-secondary:hover{background:var(--beige-50)}
.btn-ghost{background:transparent;color:var(--fg1)}.btn-ghost:hover{background:var(--beige-100)}
.btn-sm{height:28px;padding:0 12px;font-size:12px;border-radius:6px}
.btn-destructive{background:var(--red-800);color:#fff;border:0}.btn-destructive:hover{background:var(--red-900)}
.btn-destr-soft{background:var(--red-100);color:var(--red-900);border:1px solid var(--red-500)}.btn-destr-soft:hover{background:var(--red-200)}

.popconf{background:var(--gray-930);color:#fff;border-radius:8px;padding:12px;min-width:220px;max-width:280px;position:relative}
.popconf-title{font-size:12px;line-height:16px;font-weight:700}
.popconf-desc{font-size:12px;line-height:16px;font-weight:500;color:var(--gray-400);margin-top:6px}
.popconf-actions{display:flex;gap:6px;margin-top:10px}
.arrow-d{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:6px solid var(--gray-930)}
.arrow-u{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:6px solid var(--gray-930)}
</style></head><body style="padding:14px 16px">
<div class="section">PopConfirm · dark bubble · cancel + confirm (destructive)</div>
<div class="row" style="gap:32px;padding-bottom:16px;align-items:flex-end">
  <!-- side: top -->
  <div style="display:flex;flex-direction:column;align-items:center;gap:0">
    <div class="popconf" style="position:relative">
      <div class="popconf-title">Delete this run?</div>
      <div class="popconf-desc">This cannot be undone.</div>
      <div class="popconf-actions">
        <button class="btn btn-secondary btn-sm" style="flex:1;font-family:inherit">Cancel</button>
        <button class="btn btn-destr-soft btn-sm" style="flex:1;font-family:inherit">Delete</button>
      </div>
      <div class="arrow-d"></div>
    </div>
    <button class="btn btn-secondary" style="margin-top:6px;font-family:inherit">Delete run</button>
    <div style="font-size:10px;color:var(--fg3);margin-top:4px">side: top</div>
  </div>
  <!-- side: bottom -->
  <div style="display:flex;flex-direction:column;align-items:center;gap:0">
    <button class="btn btn-secondary" style="font-family:inherit">Remove policy</button>
    <div class="popconf" style="position:relative;margin-top:6px">
      <div class="arrow-u"></div>
      <div class="popconf-title">Remove this policy?</div>
      <div class="popconf-desc">Ema will stop using it on new runs.</div>
      <div class="popconf-actions">
        <button class="btn btn-secondary btn-sm" style="flex:1;font-family:inherit">Cancel</button>
        <button class="btn btn-destr-soft btn-sm" style="flex:1;font-family:inherit">Remove</button>
      </div>
    </div>
    <div style="font-size:10px;color:var(--fg3);margin-top:4px">side: bottom</div>
  </div>
  <!-- no confirm text only -->
  <div style="display:flex;flex-direction:column;align-items:center;gap:0">
    <div class="popconf" style="position:relative;min-width:200px">
      <div class="popconf-title">Sign out?</div>
      <div class="popconf-actions">
        <button class="btn btn-secondary btn-sm" style="flex:1;font-family:inherit">Cancel</button>
        <button class="btn btn-primary btn-sm" style="flex:1;font-family:inherit">Sign out</button>
      </div>
      <div class="arrow-d"></div>
    </div>
    <button class="btn btn-ghost" style="margin-top:6px;font-family:inherit">Sign out</button>
    <div style="font-size:10px;color:var(--fg3);margin-top:4px">confirm (non-destructive)</div>
  </div>
</div></body></html>
