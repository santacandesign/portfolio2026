<!doctype html>
<!-- @dsCard group="Components" name="Components · Skeleton" subtitle="rounded/square/rectangle · sm/md/lg · shimmer · SkeletonText · card pattern" viewport="700x440" --><html><head><meta charset="utf-8">
<link rel="stylesheet" href="_base.css">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"/>
<style>
.section{font-size:12px;line-height:16px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--fg3);margin:10px 0 6px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.col{display:flex;flex-direction:column;gap:8px}

@keyframes shimmer{0%{transform:translateX(-100%)} 100%{transform:translateX(100%)}}
.skel{background:linear-gradient(90deg,var(--beige-400) 0%,var(--beige-50) 100%);
      position:relative;overflow:hidden}
.skel::after{content:'';position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);
  animation:shimmer 1.5s ease-in-out infinite}
/* shapes */
.skel-rect{border-radius:8px}
.skel-sq-sm{border-radius:6px;width:28px;height:28px}
.skel-sq-md{border-radius:8px;width:36px;height:36px}
.skel-sq-lg{border-radius:12px;width:44px;height:44px}
.skel-round-sm{border-radius:50%;width:28px;height:28px}
.skel-round-md{border-radius:50%;width:36px;height:36px}
.skel-round-lg{border-radius:50%;width:44px;height:44px}
/* rect sizes */
.skel-r-sm{width:120px;height:28px}
.skel-r-md{width:120px;height:36px}
.skel-r-lg{width:120px;height:44px}
</style></head><body style="padding:14px 16px">
<div class="section">Shapes · rounded / square / rectangle</div>
<div class="row" style="align-items:flex-end">
  <div class="skel skel-round-sm"></div>
  <div class="skel skel-round-md"></div>
  <div class="skel skel-round-lg"></div>
  <div style="width:1px;height:20px;background:var(--beige-300);margin:0 4px"></div>
  <div class="skel skel-sq-sm"></div>
  <div class="skel skel-sq-md"></div>
  <div class="skel skel-sq-lg"></div>
  <div style="width:1px;height:20px;background:var(--beige-300);margin:0 4px"></div>
  <div class="skel skel-rect skel-r-sm"></div>
  <div class="skel skel-rect skel-r-md"></div>
  <div class="skel skel-rect skel-r-lg"></div>
</div>
<div class="section">SkeletonText · 1 / 3 lines (last line 80% / 65%)</div>
<div class="col" style="max-width:320px;gap:12px">
  <div class="skel skel-rect" style="width:200px;height:20px"></div>
  <div class="col" style="gap:6px">
    <div class="skel skel-rect" style="width:100%;height:20px"></div>
    <div class="skel skel-rect" style="width:100%;height:20px"></div>
    <div class="skel skel-rect" style="width:65%;height:20px"></div>
  </div>
</div>
<div class="section">Card skeleton (list row pattern)</div>
<div class="col" style="max-width:400px;background:#fff;border:1px solid var(--beige-300);border-radius:12px;padding:14px;gap:12px">
  
  <div class="row" style="gap:12px">
    <div class="skel skel-round-md" style="flex-shrink:0"></div>
    <div class="col" style="flex:1;gap:6px">
      <div class="skel skel-rect" style="width:60%;height:16px"></div>
      <div class="skel skel-rect" style="width:40%;height:14px"></div>
    </div>
    <div class="skel skel-rect" style="width:60px;height:24px;border-radius:9999px"></div>
  </div>
  <div class="row" style="gap:12px">
    <div class="skel skel-round-md" style="flex-shrink:0"></div>
    <div class="col" style="flex:1;gap:6px">
      <div class="skel skel-rect" style="width:60%;height:16px"></div>
      <div class="skel skel-rect" style="width:40%;height:14px"></div>
    </div>
    <div class="skel skel-rect" style="width:60px;height:24px;border-radius:9999px"></div>
  </div>
  <div class="row" style="gap:12px">
    <div class="skel skel-round-md" style="flex-shrink:0"></div>
    <div class="col" style="flex:1;gap:6px">
      <div class="skel skel-rect" style="width:60%;height:16px"></div>
      <div class="skel skel-rect" style="width:40%;height:14px"></div>
    </div>
    <div class="skel skel-rect" style="width:60px;height:24px;border-radius:9999px"></div>
  </div>
</div></body></html>
