<!doctype html>
<!-- @dsCard group="Components" name="Components · Popover" subtitle="filter popover · info popover · top/bottom · light border shadow" viewport="700x480" --><html><head><meta charset="utf-8">
<link rel="stylesheet" href="_base.css">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"/>
<style>
.section{font-size:12px;line-height:16px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--fg3);margin:10px 0 6px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
/* shared btn */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 16px;border-radius:6px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;border:0;transition:background .15s}
.btn-primary{background:var(--green-800);color:#fff}.btn-primary:hover{background:var(--green-900)}
.btn-secondary{background:#fff;color:var(--fg1);border:1px solid var(--beige-500)}.btn-secondary:hover{background:var(--beige-50)}
.btn-ghost{background:transparent;color:var(--fg1)}.btn-ghost:hover{background:var(--beige-100)}
.btn-sm{height:28px;padding:0 12px;font-size:12px;border-radius:6px}
.btn-destructive{background:var(--red-800);color:#fff;border:0}.btn-destructive:hover{background:var(--red-900)}
.btn-destr-soft{background:var(--red-100);color:var(--red-900);border:1px solid var(--red-500)}.btn-destr-soft:hover{background:var(--red-200)}

.popover{background:#fff;border:1px solid var(--beige-400);border-radius:10px;box-shadow:0 4px 6px -1px rgba(35,33,25,.08),0 2px 4px -2px rgba(35,33,25,.06);padding:14px 16px;min-width:220px;max-width:320px}
.pop-arrow-d{width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:7px solid var(--beige-400);position:relative}
.pop-arrow-d::after{content:'';position:absolute;top:-8px;left:-6px;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:6px solid #fff}
.pop-arrow-u{width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:7px solid var(--beige-400);position:relative}
.pop-arrow-u::after{content:'';position:absolute;bottom:-8px;left:-6px;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:6px solid #fff}
</style></head><body style="padding:14px 16px">
<div class="section">Popover · white surface · light border shadow · trigger + content</div>
<div class="row" style="gap:32px;padding-bottom:16px;align-items:flex-end">
  <!-- filter popover top -->
  <div style="display:flex;flex-direction:column;align-items:flex-start;gap:0">
    <div class="popover">
      <div style="font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--fg3);margin-bottom:10px">Filter by status</div>
      <div style="display:flex;flex-direction:column;gap:6px">
        
        <label style="display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer">
          <input type="checkbox" checked style="width:16px;height:16px;border-radius:4px;appearance:none;border:1px solid var(--beige-500);background:var(--green-800);flex-shrink:0">
          Completed
        </label>
        <label style="display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer">
          <input type="checkbox" checked style="width:16px;height:16px;border-radius:4px;appearance:none;border:1px solid var(--beige-500);background:var(--green-800);flex-shrink:0">
          Running
        </label>
        <label style="display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer">
          <input type="checkbox"  style="width:16px;height:16px;border-radius:4px;appearance:none;border:1px solid var(--beige-500);background:#fff;flex-shrink:0">
          Needs review
        </label>
        <label style="display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer">
          <input type="checkbox"  style="width:16px;height:16px;border-radius:4px;appearance:none;border:1px solid var(--beige-500);background:#fff;flex-shrink:0">
          Pending
        </label>
      </div>
      <div style="margin-top:12px;display:flex;justify-content:flex-end;gap:6px">
        <button class="btn btn-ghost btn-sm" style="font-family:inherit">Clear</button>
        <button class="btn btn-primary btn-sm" style="font-family:inherit">Apply</button>
      </div>
    </div>
    <div style="margin-top:4px;display:flex;flex-direction:column;align-items:flex-start;gap:4px">
      <div class="pop-arrow-d" style="margin-left:24px"></div>
      <button class="btn btn-secondary" style="font-family:inherit"><i class="ph ph-funnel" style="font-size:14px"></i>Filter</button>
    </div>
    <div style="font-size:10px;color:var(--fg3);margin-top:4px">side: top</div>
  </div>
  <!-- info popover bottom -->
  <div style="display:flex;flex-direction:column;align-items:flex-start;gap:4px">
    <button class="btn btn-ghost" style="font-family:inherit"><i class="ph ph-info" style="font-size:16px"></i>What is auto-resolve?</button>
    <div class="pop-arrow-u" style="margin-left:24px"></div>
    <div class="popover">
      <div style="font-size:14px;font-weight:700;margin-bottom:6px">Auto-resolve</div>
      <div style="font-size:13px;line-height:18px;color:var(--fg2)">When enabled, Ema closes cases without human review if the intent matches a policy and confidence is above the threshold.</div>
      <a href="#" style="display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--green-800);text-decoration:none;margin-top:8px">Learn more <i class="ph ph-arrow-square-out" style="font-size:12px"></i></a>
    </div>
    <div style="font-size:10px;color:var(--fg3);margin-top:4px">side: bottom</div>
  </div>
</div></body></html>
