<!doctype html>
<!-- @dsCard group="Components" name="Components · InputOTP" subtitle="6-digit · 4-digit with separator · error state" viewport="700x300" --><html><head><meta charset="utf-8">
<link rel="stylesheet" href="_base.css">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"/>
<style>
.section{font-size:12px;line-height:16px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--fg3);margin:10px 0 6px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
.col{display:flex;flex-direction:column;gap:8px}
.lbl{font-size:12px;font-weight:500;line-height:16px;color:var(--fg2);margin-bottom:4px;display:block}
.lbl .req{color:var(--red-800)}
.hint-default{font-size:11px;color:var(--gray-800);margin-top:3px}
.hint-success{font-size:11px;color:var(--green-930);margin-top:3px}
.hint-error{font-size:11px;color:var(--red-930);margin-top:3px}
.inp{height:36px;padding:0 14px;border:1px solid var(--beige-500);border-radius:8px;font-family:inherit;font-size:14px;outline:none;color:var(--fg1);background:#fff;width:100%;box-sizing:border-box}
.inp:focus{border-color:var(--green-500);box-shadow:0 0 0 3px var(--green-200)}
.inp.error{border-color:var(--red-500)}
.inp.success{border-color:var(--green-500)}
.inp.disabled{background:var(--beige-100);border-color:var(--beige-300);color:var(--beige-800);cursor:not-allowed}
.inp-sm{height:28px;font-size:12px}
.inp-lg{height:44px;font-size:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 16px;border-radius:6px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;border:0}
.btn-sm{height:28px;padding:0 12px;font-size:12px;border-radius:6px}
.btn-lg{height:44px;padding:0 16px;font-size:16px;border-radius:8px}
.btn-primary{background:var(--green-800);color:#fff}
.btn-secondary{background:#fff;color:var(--fg1);border:1px solid var(--beige-500)}
.btn-ghost{background:transparent;color:var(--fg1)}

.otp-slot{width:40px;height:48px;border:1px solid var(--beige-500);border-radius:8px;font-size:20px;font-weight:700;text-align:center;font-family:var(--app-font-family);background:#fff;color:var(--fg1);outline:none;transition:border-color .15s,box-shadow .15s}
.otp-slot:focus{border-color:var(--green-500);box-shadow:0 0 0 3px var(--green-200);z-index:1}
.otp-slot.filled{background:var(--beige-50)}
.otp-slot.active{border-color:var(--green-500);box-shadow:0 0 0 3px var(--green-200)}
.otp-slot.error{border-color:var(--red-500)}
.otp-sep{font-size:20px;font-weight:700;color:var(--fg3);align-self:center;padding:0 2px}
</style></head><body style="padding:14px 16px">
<div class="section">InputOTP · 6-digit · 4-digit · error state</div>
<div class="col" style="gap:20px">
  <div>
    <label class="lbl">6-digit OTP — partially filled</label>
    <div style="display:flex;gap:8px">
      <input class="otp-slot filled" maxlength="1" value="4" readonly/>
      <input class="otp-slot filled" maxlength="1" value="2" readonly/>
      <input class="otp-slot active" maxlength="1" placeholder="·"/>
      <input class="otp-slot" maxlength="1" placeholder="·"/>
      <input class="otp-slot" maxlength="1" placeholder="·"/>
      <input class="otp-slot" maxlength="1" placeholder="·"/>
    </div>
    <div class="hint-default" style="margin-top:6px">Enter the 6-digit code sent to priya@acme.co</div>
  </div>
  <div>
    <label class="lbl">4-digit with separator</label>
    <div style="display:flex;gap:8px;align-items:center">
      <input class="otp-slot filled" maxlength="1" value="8" readonly/>
      <input class="otp-slot filled" maxlength="1" value="3" readonly/>
      <div class="otp-sep">–</div>
      <input class="otp-slot filled" maxlength="1" value="1" readonly/>
      <input class="otp-slot filled" maxlength="1" value="9" readonly/>
    </div>
  </div>
  <div>
    <label class="lbl">Error state — incorrect code</label>
    <div style="display:flex;gap:8px">
      <input class="otp-slot error" maxlength="1" value="4" readonly/><input class="otp-slot error" maxlength="1" value="5" readonly/><input class="otp-slot error" maxlength="1" value="6" readonly/><input class="otp-slot error" maxlength="1" value="7" readonly/><input class="otp-slot error" maxlength="1" value="8" readonly/><input class="otp-slot error" maxlength="1" value="9" readonly/>
    </div>
    <div class="hint-error" style="margin-top:6px">Incorrect code. 2 attempts remaining.</div>
  </div>
</div>
</body></html>
